# Animated — the theme that goes with the Animated Cards.
#
# The cards draw their own surfaces: a near-black blue-tinted panel, one saturated cyan for
# "something is happening", steel-blue for idle, a small semantic red/amber/green for state.
# Dropped onto a stock dashboard they look like visitors from another app — the built-in tiles
# are flat grey, the radii disagree, the state tints are HA's own. This theme pushes the cards'
# language down into Home Assistant's design tokens so every card inherits it: tiles, thermostat,
# history and energy graphs, badges, dialogs, the YAML editor — and third-party cards, as far as
# they respect the tokens.
#
# Every key was checked against the frontend source it actually has to satisfy
# (`src/resources/theme/`, `src/components/ha-*.ts`) rather than copied from other people's
# themes, which is how most themes end up half-inert: HA has migrated its controls off MWC onto
# `ha-switch` / `ha-slider` / `ha-color-*` tokens, so the familiar `switch-checked-color`,
# `slider-color`, `paper-item-*` keys now style nothing at all. They are not in here.
#
# THREE token systems are set on purpose, because three different families of card read three
# different things:
#   · HA classic   `--red-color`, `--amber-color`, …   → built-in cards, badges, state colours
#   · HA 2026      `--ha-color-*`, `--ha-switch-*`, …  → dialogs, buttons, switches, sliders
#   · Mushroom     `--mush-rgb-red`, …                 → every Mushroom card, i.e. every animated
#                                                        card. Mushroom DEFINES `--rgb-red` itself
#                                                        as `var(--mush-rgb-red, …)`, so setting
#                                                        `--rgb-red` alone does nothing to it.
#
# DARK ONLY, on purpose. A `modes:` block with `dark:` and no `light:` is how HA is told a theme
# is dark: it forces the frontend's dark flag on, which also brings in HA's own dark defaults
# (map filter, code editor, the dark `--ha-color-*` mapping). The same values are repeated at the
# top level so a per-view use on a light client still gets the surfaces.
# A light mode was written and tested, then thrown away: the cards are dark glass by design and
# several hardcode light-on-dark text (the clock kind's `--card-primary-color: rgba(236, 242,
# 248, 0.96)`, the appliance cards' `#e9eef5` screen text), so on white surfaces they went from
# "different" to "unreadable". A theme that misrepresents the cards it ships with is worse than
# one that only does nights.
#
# INSTALL
#   1. copy this file to `/config/themes/animated.yaml`
#   2. make sure `configuration.yaml` contains, on separate lines:
#        frontend:
#          themes: !include_dir_merge_named themes
#      (if you had to add it, restart HA once; after that Reload Themes is enough)
#   3. Developer tools → YAML → Reload themes
#   4. Profile → Theme → Animated
# Choose it in your PROFILE. A per-view `theme: Animated` styles that view's cards only — the
# sidebar, header, more-info dialogs and every pop-up render outside the view and keep whatever
# the profile theme is.

Animated:
  # ── The accent, in two strengths ───────────────────────────────────────────────────────
  # rgb(0, 200, 255) is what the cards run when active (the washer's glow, the radar ping, the
  # speedtest rain), so it drives everything that reads as STATE or a small control.
  #
  # `primary-color` is deliberately NOT that cyan: HA paints whole surfaces with it — the
  # media-control card fills its entire body with it when there's no album art — and #00C8FF at
  # that size is a neon slab that white text fails against (1.96:1). #0B7A99 is the same hue at
  # fill strength (white on it 4.93:1) and still reads as family. Found by looking: the first
  # draft turned the TV card into a highlighter.
  primary-color: "#0B7A99"
  dark-primary-color: "#07566E"
  darker-primary-color: "#053F52"
  light-primary-color: "#00C8FF"
  accent-color: "#00C8FF"

  # ── Semantic palette (HA classic tokens) ───────────────────────────────────────────────
  # HA derives every domain's state colour from these — `--state-light-active-color` is
  # `var(--amber-color)`, locks are `var(--green-color)` — so retinting here is what makes a
  # stock tile agree with an animated card without touching either.
  #
  # Lights and switches stay AMBER rather than being forced to the cyan accent: a lit bulb is
  # warm, and the animated lamp cards glow in the bulb's own colour. Cyan means "this thing is
  # doing something"; amber means "this light is on". Two different sentences.
  #
  # The green is #2ECC71 rather than a mintier one because of red/amber/green under colour
  # blindness: simulated for deuteranopia, the old #3DDC84 sat 1.12:1 from amber — the same dull
  # yellow. #2ECC71 gets that to 1.39:1, which is better and still not enough on its own. No
  # three-hue state code survives CVD by luminance alone, which is exactly why the cards pair
  # colour with badge text ("DETECTED" / "CLEAR"). Don't rely on the hue by itself.
  red-color: "#F44336"
  pink-color: "#F06292"
  purple-color: "#A78BFA"
  deep-purple-color: "#8B5CF6"
  indigo-color: "#6C8DFF"
  blue-color: "#2196F3"
  light-blue-color: "#4FC3F7"
  cyan-color: "#00C8FF"
  teal-color: "#26C6DA"
  green-color: "#2ECC71"
  light-green-color: "#8BC34A"
  lime-color: "#C0CA33"
  yellow-color: "#FFD54F"
  amber-color: "#FFC66D"
  orange-color: "#FFA726"
  deep-orange-color: "#FF7043"
  brown-color: "#A1887F"
  grey-color: "#8B95A3"
  light-grey-color: "#B9C2CE"
  dark-grey-color: "#59636F"
  blue-grey-color: "#6C89A8"
  black-color: "#05070A"
  white-color: "#FFFFFF"
  disabled-color: "#39424E"

  # ── The Mushroom hinge ─────────────────────────────────────────────────────────────────
  # Mushroom ships `--rgb-green: var(--mush-rgb-green, var(--default-green))`, so a theme that
  # sets `--rgb-green` is overruled by Mushroom's own definition and every animated card keeps
  # Material's #4CAF50 while the built-in tiles move. `--mush-rgb-*` is the token that actually
  # lands. This block is what makes a stock tile and an animated card resolve the same green.
  mush-rgb-red: 244, 67, 54
  mush-rgb-pink: 240, 98, 146
  mush-rgb-purple: 167, 139, 250
  mush-rgb-deep-purple: 139, 92, 246
  mush-rgb-indigo: 108, 141, 255
  mush-rgb-blue: 33, 150, 243
  mush-rgb-light-blue: 79, 195, 247
  mush-rgb-cyan: 0, 200, 255
  mush-rgb-teal: 38, 198, 218
  mush-rgb-green: 46, 204, 113
  mush-rgb-light-green: 139, 195, 74
  mush-rgb-lime: 192, 202, 51
  mush-rgb-yellow: 255, 213, 79
  mush-rgb-amber: 255, 198, 109
  mush-rgb-orange: 255, 167, 38
  mush-rgb-deep-orange: 255, 112, 67
  mush-rgb-brown: 161, 136, 127
  mush-rgb-grey: 139, 149, 163
  mush-rgb-light-grey: 185, 194, 206
  mush-rgb-dark-grey: 89, 99, 111
  mush-rgb-blue-grey: 108, 137, 168
  mush-rgb-black: 5, 7, 10
  mush-rgb-white: 255, 255, 255
  mush-rgb-disabled: 107, 117, 129
  mush-rgb-danger: 244, 67, 54
  mush-rgb-warning: 255, 167, 38
  mush-rgb-success: 46, 204, 113
  mush-rgb-info: 79, 195, 247
  mush-rgb-state-entity: 0, 200, 255
  mush-rgb-state-light: 255, 198, 109
  mush-rgb-state-fan: 0, 200, 255
  mush-rgb-state-media-player: 0, 200, 255
  mush-rgb-state-humidifier: 79, 195, 247
  mush-rgb-state-vacuum: 38, 198, 218
  mush-rgb-state-lock-locked: 46, 204, 113
  mush-rgb-state-lock-unlocked: 244, 67, 54
  mush-rgb-state-lock-pending: 255, 167, 38
  mush-rgb-state-alarm-disarmed: 108, 137, 168
  mush-rgb-state-alarm-armed: 244, 67, 54
  mush-rgb-state-alarm-triggered: 244, 67, 54
  mush-rgb-state-person-home: 0, 200, 255
  mush-rgb-state-person-not-home: 108, 137, 168
  mush-rgb-state-climate-heat: 255, 112, 67
  mush-rgb-state-climate-cool: 79, 195, 247
  mush-rgb-state-climate-off: 89, 99, 111
  # Kept for any custom card that reads the plain names (HA core itself reads only ten
  # `--rgb-*` tokens, and derives those automatically from the hex keys above).
  rgb-red: 244, 67, 54
  rgb-blue: 33, 150, 243
  rgb-cyan: 0, 200, 255
  rgb-green: 46, 204, 113
  rgb-amber: 255, 198, 109
  rgb-orange: 255, 167, 38
  rgb-grey: 139, 149, 163
  rgb-blue-grey: 108, 137, 168
  rgb-disabled: 107, 117, 129

  # ── Surfaces ───────────────────────────────────────────────────────────────────────────
  # The page is ink, the cards are lit panels floating on it — which is how the floorplan reads,
  # and the floorplan's CSS now consumes these two tokens, so a room on the plan is literally
  # drawn in the card colour.
  #
  # Flat, not a gradient — and NOT for the reason you might assume. `ha-card` uses the
  # `background:` shorthand, so a gradient is legal there; the first draft of this theme lost
  # every card surface because of YAML, not CSS: an unquoted `linear-gradient(165deg, #161C24 …)`
  # is truncated at the first ` #` (YAML comment) to `linear-gradient(165deg,`, which is invalid
  # and resets the whole background. Quote any value containing a hash. Flat is still the right
  # answer, because the calendar card and plenty of third-party cards consume this token as
  # `background-color` / `box-shadow`, where a gradient silently becomes transparent/none. Cards
  # that want a gradient draw their own, which is what the animated cards do.
  primary-background-color: "#06080B"
  # hui-view-background paints the page from --lovelace-background FIRST and only falls back to
  # primary-background-color. Any profile theme that defines lovelace-background (Graphite does)
  # therefore leaks its page colour through a per-view Animated theme — every key here is scoped
  # to the view container, but an unset key lets the profile value inherit straight past it.
  # Setting it explicitly is what makes the ink-behind-lit-panels depth actually appear.
  lovelace-background: "#06080B"
  secondary-background-color: "#151C25"
  card-background-color: "#151C25"
  ha-card-background: "#151C25"
  ha-card-border-color: "rgba(122, 160, 200, 0.14)"
  ha-card-box-shadow: "0 10px 24px rgba(0, 0, 0, 0.40)"
  divider-color: "rgba(122, 160, 200, 0.14)"
  outline-color: "rgba(122, 160, 200, 0.18)"
  outline-hover-color: "rgba(0, 200, 255, 0.45)"
  clear-background-color: "#0D1219"
  chip-background-color: "rgba(122, 160, 200, 0.14)"
  data-table-background-color: "#151C25"
  table-row-background-color: "#151C25"
  table-row-alternative-background-color: "#1A222C"
  table-header-background-color: "#1A222C"
  scrollbar-thumb-color: "rgba(122, 160, 200, 0.40)"
  shadow-color: "0, 0, 0"
  # HA's 2026 surface scale, which the dialogs, config pages and new-style forms read instead of
  # the classic tokens above. Without these, half the app stays HA's warm neutral grey next to
  # this theme's blue-tinted panels.
  ha-color-surface-default: "#151C25"
  ha-color-surface-low: "#12181F"
  ha-color-surface-lower: "#0D1219"
  ha-color-neutral-10: "#151C25"
  ha-color-neutral-20: "#1A222C"
  ha-color-form-background: "#1A222C"
  ha-color-form-background-hover: "#1F2833"
  ha-color-form-background-disabled: "#12181F"
  ha-color-border-neutral-quiet: "rgba(122, 160, 200, 0.14)"
  ha-color-border-neutral-normal: "rgba(122, 160, 200, 0.22)"
  ha-color-border-primary-loud: "#00C8FF"
  ha-color-fill-primary-normal-resting: "rgba(0, 200, 255, 0.16)"
  ha-color-fill-primary-loud-resting: "#0B7A99"
  ha-color-fill-neutral-normal-resting: "rgba(122, 160, 200, 0.14)"
  ha-color-fill-danger-loud-resting: "#F44336"
  ha-color-fill-warning-loud-resting: "#FFA726"
  ha-color-fill-success-loud-resting: "#2ECC71"

  # ── Geometry ───────────────────────────────────────────────────────────────────────────
  # 16px sits between HA's 12 and the Alexa cards' 18 — round enough to read as one family,
  # tight enough that a 6-column tile doesn't become a pill. `ha-card-border-radius` alone only
  # rounds cards; the radius SCALE below is what carries it into badges, chips, menus, buttons
  # and tile features. The animated cards clip their scenery with
  # `inset(0 0 0 0 round var(--ha-card-border-radius))`, so they follow this too.
  ha-card-border-radius: 16px
  ha-border-radius-md: 10px
  ha-border-radius-lg: 16px
  ha-border-radius-xl: 16px
  ha-card-features-border-radius: 12px
  ha-tile-icon-border-radius: 12px
  mush-icon-border-radius: 16px
  ha-dialog-border-radius: 20px
  ha-badge-border-radius: 14px
  mdc-shape-small: 12px
  mdc-shape-medium: 16px

  # ── Type ───────────────────────────────────────────────────────────────────────────────
  # Body type stays HA's own — the cards don't fight it. The mono face is pinned to the stack
  # the HUD readouts use (speedtest gauge, clock digits, floorplan temps), so a markdown code
  # block and a card readout look related.
  ha-font-family-code: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace
  code-font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace

  # ── Text ───────────────────────────────────────────────────────────────────────────────
  # Cool white on ink, blue-grey secondary — the Alexa cards' screen text, promoted to the whole
  # UI: 15.4:1 and 6.9:1 on the card surface. The `ha-color-text-*` pair is the same values for
  # the 2026 components, which otherwise render pure #FFFFFF next to this theme's softer white.
  primary-text-color: "#E9EEF5"
  secondary-text-color: "#93A1B5"
  text-primary-color: "#05070A"
  text-light-primary-color: "#E9EEF5"
  disabled-text-color: "#6B7581"
  ha-color-text-primary: "#E9EEF5"
  ha-color-text-secondary: "#93A1B5"
  ha-color-text-disabled: "#6B7581"
  ha-color-text-link: "#00C8FF"

  # ── Chrome ─────────────────────────────────────────────────────────────────────────────
  app-header-background-color: "#06080B"
  app-header-text-color: "#E9EEF5"
  app-header-edit-background-color: "#151C25"
  app-header-border-bottom: "1px solid rgba(122, 160, 200, 0.14)"
  app-theme-color: "#06080B"
  sidebar-background-color: "#06080B"
  sidebar-icon-color: "#8B95A3"
  sidebar-text-color: "#C2CCD8"
  sidebar-selected-icon-color: "#00C8FF"
  sidebar-selected-text-color: "#E9EEF5"
  # The map card inverts its tiles for dark themes; the stock filter lands teal on a blue-ink
  # theme, so it's re-hued to sit with the plan rather than fight it.
  map-filter: "invert(0.92) hue-rotate(185deg) brightness(0.95) grayscale(0.25)"

  # ── State ──────────────────────────────────────────────────────────────────────────────
  # Idle steel, active cyan, dead grey — the cards' own three-way split, so a stock tile dims
  # and lifts on the same cue an animated card does. `state-icon-color` is the neutral chrome
  # colour for entities with no domain colour: it uses the blue-grey rather than a second bright
  # blue, so the palette has ONE accent and a supporting cast rather than two accents.
  state-icon-color: "#6C89A8"
  state-active-color: "#00C8FF"
  state-inactive-color: "#6B7581"
  state-unavailable-color: "#59636F"
  state-icon-error-color: "#F44336"

  # ── Controls ───────────────────────────────────────────────────────────────────────────
  # These are the modern token names. The familiar `switch-checked-color` / `slider-color` /
  # `ha-button-*-color` keys are gone from the frontend entirely — a theme setting them looks
  # thorough and changes nothing.
  ha-switch-checked-background-color: "#00C8FF"
  ha-switch-checked-border-color: "#00C8FF"
  ha-switch-checked-thumb-background-color: "#05070A"
  ha-switch-background-color: "#39424E"
  ha-switch-border-color: "rgba(122, 160, 200, 0.22)"
  ha-switch-thumb-background-color: "#C2CCD8"
  ha-slider-thumb-color: "#00C8FF"
  ha-slider-indicator-color: "#00C8FF"
  ha-slider-track-color: "#39424E"
  # The tile card's feature row (brightness, cover position, humidity) reads its own pair.
  control-slider-color: "#00C8FF"
  control-slider-background: "#39424E"
  control-switch-on-color: "#00C8FF"
  control-switch-off-color: "#39424E"
  slider-track-color: "#39424E"
  input-fill-color: "#1A222C"
  input-ink-color: "#E9EEF5"
  input-label-ink-color: "#93A1B5"
  input-idle-line-color: "rgba(122, 160, 200, 0.30)"
  input-hover-line-color: "#00C8FF"
  input-dropdown-icon-color: "#8B95A3"
  input-disabled-fill-color: "#12181F"
  input-disabled-ink-color: "#6B7581"
  input-disabled-line-color: "rgba(122, 160, 200, 0.12)"
  input-outlined-idle-border-color: "rgba(122, 160, 200, 0.30)"
  input-outlined-hover-border-color: "#00C8FF"
  input-outlined-disabled-border-color: "rgba(122, 160, 200, 0.12)"
  ha-assist-chip-filled-container-color: "rgba(122, 160, 200, 0.14)"
  ha-assist-chip-active-container-color: "rgba(0, 200, 255, 0.18)"
  ha-tooltip-background-color: "#1A222C"
  ha-tooltip-text-color: "#E9EEF5"
  ha-tooltip-border-radius: 10px

  # ── Dialogs / menus ────────────────────────────────────────────────────────────────────
  # More-info dialogs and Bubble pop-ups render OUTSIDE the dashboard view, so these only take
  # effect when the theme is the user's PROFILE theme, not a per-view one.
  ha-dialog-surface-background: "#151C25"
  mdc-dialog-scrim-color: "rgba(5, 7, 10, 0.72)"
  mdc-theme-surface: "#151C25"
  mdc-theme-primary: "#00C8FF"
  mdc-theme-secondary: "#00C8FF"
  mdc-text-field-fill-color: "#1A222C"
  mdc-text-field-ink-color: "#E9EEF5"
  mdc-text-field-label-ink-color: "#93A1B5"

  # ── Graphs ─────────────────────────────────────────────────────────────────────────────
  # History and energy charts get the same palette so a chart under a card isn't a different
  # product. Energy keeps its conventional meanings (solar warm, grid cool, gas violet).
  history-unavailable-color: "rgba(139, 149, 163, 0.20)"
  history-unknown-color: "#39424E"
  energy-grid-consumption-color: "#4FC3F7"
  energy-grid-return-color: "#2ECC71"
  energy-solar-color: "#FFC66D"
  energy-battery-in-color: "#8BC34A"
  energy-battery-out-color: "#00C8FF"
  energy-gas-color: "#A78BFA"
  energy-water-color: "#26C6DA"
  energy-non-fossil-color: "#2ECC71"

  # ── Badges / alerts ────────────────────────────────────────────────────────────────────
  label-badge-background-color: "#151C25"
  label-badge-text-color: "#E9EEF5"
  label-badge-red: "#F44336"
  label-badge-green: "#2ECC71"
  label-badge-blue: "#00C8FF"
  label-badge-yellow: "#FFC66D"
  label-badge-grey: "#59636F"
  error-color: "#F44336"
  warning-color: "#FFA726"
  success-color: "#2ECC71"
  info-color: "#4FC3F7"

  # ── YAML / code editor ─────────────────────────────────────────────────────────────────
  # The automation and card editors are where a house like this actually spends its time, so
  # they're part of the look rather than an afterthought — same mono face, accent on keys.
  code-editor-background-color: "#0D1219"
  markdown-code-background-color: "#0D1219"
  codemirror-keyword: "#00C8FF"
  codemirror-property: "#8AB4FF"
  codemirror-atom: "#FFC66D"
  codemirror-number: "#FFC66D"
  codemirror-string: "#2ECC71"
  codemirror-string-2: "#2ECC71"
  codemirror-comment: "#6B7581"
  codemirror-variable: "#E9EEF5"
  codemirror-variable-2: "#8AB4FF"
  codemirror-variable-3: "#A78BFA"
  codemirror-def: "#00C8FF"
  codemirror-meta: "#93A1B5"
  codemirror-operator: "#F06292"
  codemirror-qualifier: "#26C6DA"
  codemirror-tag: "#F44336"
  codemirror-attribute: "#A78BFA"
  codemirror-type: "#4FC3F7"
  codemirror-builtin: "#FFA726"

  # ── Dark declaration ───────────────────────────────────────────────────────────────────
  # `dark:` present, `light:` absent = HA forces its dark flag on for this theme, which is what
  # brings in HA's own dark defaults for the pieces a theme doesn't name. The surfaces and text
  # are repeated here because the mode block is the one HA merges last; the top-level copies
  # cover per-view use on a light client, where the mode block is skipped entirely.
  modes:
    dark:
      primary-background-color: "#06080B"
      lovelace-background: "#06080B"
      secondary-background-color: "#151C25"
      card-background-color: "#151C25"
      ha-card-background: "#151C25"
      ha-card-border-color: "rgba(122, 160, 200, 0.14)"
      ha-card-box-shadow: "0 10px 24px rgba(0, 0, 0, 0.40)"
      ha-color-surface-default: "#151C25"
      ha-color-text-primary: "#E9EEF5"
      ha-color-text-secondary: "#93A1B5"
      primary-text-color: "#E9EEF5"
      secondary-text-color: "#93A1B5"
      text-primary-color: "#05070A"
      disabled-text-color: "#6B7581"
      state-icon-color: "#6C89A8"
      state-active-color: "#00C8FF"
      state-inactive-color: "#6B7581"
